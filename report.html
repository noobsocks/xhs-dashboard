<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OFF-AIR 인플루언서 모니터링 · 인플루언서 리포트</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><style>

<div class="hdr"><span style="color:#f4f4f4;font-weight:600;font-size:15px;letter-spacing:.3px">OFF-AIR</span><div class="divide"></div><div class="prod">인플루언서 모니터링</div><div class="spacer"></div><div class="stamp" id="stamp"></div></div>
<div class="tabs"><a class="tab" href="analysis.html">대시보드</a><a class="tab" href="dashboard.html">인플루언서 현황</a><a class="tab active" href="report.html">인플루언서 리포트</a></div>
<div class="wrap">
 <div class="sect">인플루언서 리포트</div>
 <div class="selbar"><label>인플루언서 선택</label><div class="selrow"><select id="sel"></select><div style="flex:1"></div><div class="periodtg" id="periodtg"><button class="tgb active" data-p="7">최근 7일</button><button class="tgb" data-p="30">최근 30일</button><button class="tgb" data-p="all">전체</button></div></div></div>
 <div id="report"></div>
</div>
<script>
const D=window.XHS_DATA||{notes:[],profiles:[]},notes=D.notes||[],profiles=D.profiles||[],SOC=window.XHS_SOCIALS||{},META=window.XHS_KPI||{};
{var st=document.getElementById('stamp');if(st&&D.updated_at)st.textContent='업데이트 '+D.updated_at;}
const PLAT_ICON={xiaohongshu:`<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#ff2442"/><text x="12" y="17" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-family="sans-serif">书</text></svg>`,
instagram:`<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#E1306C"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="4" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="16.5" cy="7.5" r="1.15" fill="#fff"/></svg>`,
youtube:`<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#F00"/><path d="M10 8.7l5.2 3.3L10 15.3z" fill="#fff"/></svg>`,
tiktok:`<svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#111"/><path d="M14.2 5.5c.25 1.7 1.35 2.95 3.05 3.15v2.1c-1.05.02-2-.3-3.05-.86v4.35c0 2.35-1.8 4.16-4.05 4.16s-4.05-1.86-4.05-4.16 1.81-4.16 4.05-4.16c.22 0 .43.02.64.06v2.16a2.02 2.02 0 1 0 1.41 1.94V5.5z" fill="#fff"/></svg>`};
const fmt=n=>{n=n||0;return Math.abs(n)>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'만':Math.round(n).toLocaleString('ko-KR')};
const KR={'时尚':'패션','fashion':'패션','时尚穿搭':'패션','穿搭':'패션','时尚博主':'패션','时尚达人':'패션','美妆':'뷰티','美妆博主':'뷰티','生活':'라이프','舞蹈':'댄스','日常':'일상','健身':'피트니스','美食':'푸드','吃播博主':'먹방','吃播':'먹방','旅行':'여행','摄影':'사진','情侣':'커플','搞笑':'유머','宠物':'반려동물','母婴':'육아','vlog':'브이로그','音乐':'음악','综艺':'예능','综艺NEFLIX':'예능'};
const catKR=c=>{if(!c)return '-';const t=c.split(/[、,，\/\s]/)[0];return KR[t]||KR[t.toLowerCase()]||c};
const up=n=>(n>=0?'+':'−')+fmt(Math.abs(n));
var AILB={'총평':'종합','정량 평가':'데이터 분석','정성 평가':'콘텐츠 반응','게시물 코멘트':'특정 콘텐츠 분석'};
function formatAI(t){return (t||'').split('\n').map(function(line){line=line.trim();if(!line)return '';
 line=line.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 line=line.replace(/(https?:\/\/[^\s)]+)/g,'<a href="$1" target="_blank" rel="noopener" class="lk">🔗 링크</a>');
 var h=line.match(/^\[(.+?)\]\s*(.*)$/);
 if(h){var hl=AILB[h[1]]||h[1];return '<div class="aihead">'+hl+'</div>'+(h[2]?'<div class="ailine">'+h[2]+'</div>':'');}
 if(line.slice(0,2)==='- '||line.slice(0,2)==='* ')return '<div class="aibul">'+line.slice(2)+'</div>';
 return '<div class="ailine">'+line+'</div>';}).join('');}
function cleanHist(h,key){let last=null;return h.map(x=>{let v=x[key]||0;if(v&&(last===null||v>=last*0.5))last=v;return last||0})}
function delta7(h,key){return deltaN(h,key,7);}
function deltaN(h,key,days){var c=cleanHist(h,key);if(!c.length)return 0;if(days==null)return c[c.length-1]-(c.find(x=>x)||0);var last=h[h.length-1].date;var cut=new Date(+new Date(last)-days*864e5).toISOString().slice(0,10);var idx=h.findIndex(x=>x.date>=cut);if(idx<0)idx=0;return c[c.length-1]-c[idx];}
var curP='7';
function pLabel(){return curP==='all'?'전체 기간':('최근 '+curP+'일');}
function pDays(){return curP==='all'?null:(+curP);}
function histStart(h){if(curP==='all'||!h.length)return 0;var last=h[h.length-1].date;var cut=new Date(+new Date(last)-(+curP)*864e5).toISOString().slice(0,10);var i=h.findIndex(x=>x.date>=cut);return i<0?0:i;}
function notesOf(p){return notes.filter(n=>(n.uid&&p.uid)?n.uid===p.uid:(n.author&&p.name&&n.author===p.name))}
// selector: sort by fans desc
const order=profiles.map((p,i)=>({p,i})).sort((a,b)=>(b.p.fans||0)-(a.p.fans||0));
const sel=document.getElementById('sel');
sel.innerHTML=order.map(o=>`<option value="${o.i}">${o.p.name||'(이름없음)'} · 팔로워 ${fmt(o.p.fans)} ${o.p.partner?'· 계약':''}</option>`).join('');
// ── 카테고리 벤치마크 (전체 1회 계산) ─────────────────────────
function noteStatsFor(p){const g=notesOf(p);if(!g.length)return {rate:null,likes:null,n:0};
 const rate=Math.round(g.reduce((a,b)=>a+(b.likes?b.collects/b.likes*100:0),0)/g.length);
 const likes=Math.round(g.reduce((a,b)=>a+(b.likes||0),0)/g.length);return {rate,likes,n:g.length};}
const CATBUCK={};
profiles.forEach(p=>{const c=catKR((META[p.uid]||{}).category||'');if(!c||c==='-')return;
 const ns=noteStatsFor(p);(CATBUCK[c]=CATBUCK[c]||[]).push({fans:p.fans||0,lc:p.likes_collects||0,rate:ns.rate,likes:ns.likes});});
function catAvg(c){const arr=CATBUCK[c]||[];const avg=k=>{const v=arr.map(x=>x[k]).filter(x=>x!=null&&!isNaN(x));return v.length?v.reduce((a,b)=>a+b,0)/v.length:null};
 return {n:arr.length,fans:avg('fans'),lc:avg('lc'),rate:avg('rate'),likes:avg('likes')};}
function topPct(c,key,val){const arr=(CATBUCK[c]||[]).map(x=>x[key]).filter(x=>x!=null);if(arr.length<2||val==null)return null;const rank=arr.filter(x=>x>val).length+1;return Math.max(1,Math.round(rank/arr.length*100));}
function benchHtml(p){const c=catKR((META[p.uid]||{}).category||'');const arr=CATBUCK[c]||[];
 if(!c||c==='-'||arr.length<2){const nm=(!c||c==='-')?'미분류':c;
  return `<div class="panel" style="margin-top:16px"><div class="ph"><h3>카테고리 벤치마크</h3><div class="sub">같은 카테고리 평균 대비</div></div><div class="benchnote">같은 카테고리(${nm}) 인플루언서가 ${arr.length}명뿐이라 평균 비교를 생략합니다. (표본 부족 · 최소 2명 필요)</div></div>`;}
 const A=catAvg(c);const ns=noteStatsFor(p);const my={fans:p.fans||0,lc:p.likes_collects||0,rate:ns.rate,likes:ns.likes};
 const defs=[{k:'fans',label:'팔로워',f:fmt},{k:'lc',label:'좋아요+저장 (누적)',f:fmt},{k:'rate',label:'평균 저장률',f:v=>v==null?'-':v+'%',pp:true},{k:'likes',label:'게시물 평균 좋아요',f:fmt}];
 const rows=defs.map(r=>{const mv=my[r.k],av=A[r.k];if(mv==null||av==null)return '';
  const better=mv>=av;const diff=r.pp?Math.round(mv-av):(av?Math.round((mv-av)/av*100):0);
  const dt=r.pp?((diff>=0?'+':'−')+Math.abs(diff)+'%p'):((diff>=0?'+':'−')+Math.abs(diff)+'%');
  return `<div class="benchrow"><div class="bl">${r.label}</div><div class="bvals"><span class="mine">${r.f(mv)}</span><span class="avg">${c} 평균 ${r.f(Math.round(av))}</span></div><div class="bdiff ${better?'up':'dn'}">${better?'▲':'▼'} ${dt}</div></div>`;}).join('');
 const tp=topPct(c,'fans',my.fans);const head=`'${c}' 카테고리 ${arr.length}명 평균 대비`+(tp!=null?` · 팔로워 상위 ${tp}%`:'');
 return `<div class="panel" style="margin-top:16px"><div class="ph"><h3>카테고리 벤치마크</h3><div class="sub">${head}</div></div><div>${rows}</div></div>`;}

// ── 소재/키워드 추출 (게시물 제목 기반) ─────────────────────────
var NOTITLE=['제목 없음','제목없음','(제목 없음)','(제목없음)'];
var EMORE=/[\u{1F000}-\u{1FAFF}☀-➿️❤]/gu;
function cleanTok(s){s=(s||'').replace(EMORE,'');return s.replace(/^[\s　·.、,，!！?？~\-—–|｜/\\"'“”‘’\[\]()]+|[\s　·.、,，!！?？~\-—–|｜/\\"'“”‘’\[\]()]+$/g,'').trim();}
function extractTopics(title){var t=title||'',out=[],m;
 var r1=/#([^\s#，,、]{1,16})/g;while(m=r1.exec(t)){var c=cleanTok(m[1]);if(c)out.push('#'+c);}
 var r2=/[【\[（(]([^】\]）)#]{1,14})[】\]）)]/g;while(m=r2.exec(t)){var c=cleanTok(m[1]);if(c.length>=2)out.push(c);}
 var head=t.split(/[｜|·:：\-–—]/)[0].replace(/[【\[（(][^】\]）)]*[】\]）)]/g,'');var c=cleanTok(head);if(c.length>=2&&c.length<=14)out.push(c);
 var seen={},res=[];out.forEach(function(x){if(NOTITLE.indexOf(x)<0&&!seen[x.toLowerCase()]){seen[x.toLowerCase()]=1;res.push(x);}});return res;}
function topTopicsFor(g,k){var map={};g.forEach(function(n){var ttl=(n.title||'').trim();if(!ttl||NOTITLE.indexOf(ttl)>=0)return;extractTopics(ttl).forEach(function(tk){(map[tk]=map[tk]||[]).push(n);});});
 var arr=Object.keys(map).map(function(tk){var ns=map[tk];return {tk:tk,n:ns.length,eng:ns.reduce(function(a,b){return a+(b.likes||0)+(b.collects||0)},0)/ns.length};});
 arr.sort(function(a,b){return b.eng-a.eng});return arr.slice(0,k||6);}

let sortKey='publish_time',sortDir=-1;
function render(idx){
 const p=profiles[idx];const g=notesOf(p);const h=p.history||[];
 const ai=(window.XHS_AI||{})[p.uid];
 // [조건] 팔로워 1,000 이상 AND 최근 30일 이내 게시물 → AI 총평 대상
 const _lastPost=g.reduce((mx,n)=>(n.publish_time&&n.publish_time>mx)?n.publish_time:mx,'');
 const _active=!!_lastPost&&((Date.now()-new Date(_lastPost).getTime())/864e5<=30);
 const _eligible=(p.fans||0)>=1000&&_active;
 let aiSub,aiBody;
 if(!p.partner){aiSub='미계약 인플루언서로 평가 불가';aiBody='<span style="color:#6f6f6f">이 인플루언서는 계약을 하지 않아 생성되지 않았습니다.</span>';}
