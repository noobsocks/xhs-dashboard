<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OFF-AIR 샤오홍슈 트래커 · 현황판</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><style>
:root{--bg:#f4f4f4;--layer:#fff;--text:#161616;--text2:#525252;--helper:#6f6f6f;--border:#e0e0e0;
--link:#0f62fe;--blue:#0f62fe;--teal:#007d79;--success:#24a148;--error:#da1e28;--hover:#e8e8e8;--black:#161616;--sel:#edf5ff;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans','Malgun Gothic',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.4}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
.hdr{height:48px;background:var(--black);display:flex;align-items:center;padding:0 16px;gap:16px;position:sticky;top:0;z-index:20}
.hdr img{height:16px}.hdr .divide{width:1px;height:20px;background:#393939}
.hdr .prod{color:#f4f4f4;font-size:14px;font-weight:600}.hdr .spacer{flex:1}.hdr .stamp{color:#8d8d8d;font-size:12px}
.tabs{background:var(--layer);display:flex;border-bottom:1px solid var(--border);padding:0 16px;position:sticky;top:48px;z-index:19}
.tab{padding:14px 16px;font-size:14px;color:var(--text2);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--text);background:var(--hover)}.tab.active{color:var(--text);font-weight:600;border-bottom-color:var(--blue)}
.wrap{max-width:1216px;margin:0 auto;padding:24px 16px 80px}
.sect{font-size:20px;font-weight:400;margin:8px 0 16px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin-bottom:24px}
.tile{background:var(--layer);padding:16px}
.tile .l{font-size:12px;color:var(--text2);letter-spacing:.32px}
.tile .v{font-family:'IBM Plex Mono',monospace;font-size:30px;font-weight:400;margin-top:8px;line-height:1}
/* toolbar: filter switcher */
.toolbar{display:flex;align-items:center;gap:0;margin-bottom:0;border:1px solid var(--border);border-bottom:none;background:var(--layer)}
.switcher{display:flex}
.sw{padding:0 16px;height:40px;display:flex;align-items:center;font-size:13px;color:var(--text2);background:var(--layer);border:none;border-right:1px solid var(--border);cursor:pointer}
.sw.active{background:var(--black);color:#fff}
.toolbar .count{margin-left:auto;padding:0 16px;font-size:12px;color:var(--helper)}
.searchwrap{display:flex;align-items:center;gap:6px;padding:0 12px;border-left:1px solid var(--border);height:40px}
.searchwrap .sicon{flex:none;opacity:.8}
.searchwrap input{border:none;outline:none;background:transparent;font-family:inherit;font-size:13px;width:190px;height:100%;color:var(--text)}
.searchwrap input::placeholder{color:#a8a8a8}
.searchwrap #searchclr{border:none;background:#e0e0e0;color:#525252;width:18px;height:18px;line-height:1;font-size:11px;cursor:pointer;border-radius:0;flex:none}
@media(max-width:640px){.searchwrap input{width:120px}}
/* table */
table{width:100%;border-collapse:collapse;background:var(--layer);border:1px solid var(--border)}
/* 메인 표: 정렬해도 컬럼폭이 흔들리지 않도록 고정 */
#tbl table{table-layout:fixed}
#tbl thead th:nth-child(1){width:29%}
#tbl thead th:nth-child(2){width:12%}
#tbl thead th:nth-child(3){width:14%}
#tbl thead th:nth-child(4){width:8%}
#tbl thead th:nth-child(5){width:37%}
#tbl tbody td:first-child{overflow:hidden;text-overflow:ellipsis}
.sind{display:inline-block;width:12px;text-align:center}
thead th{font-size:12px;font-weight:600;color:var(--text);text-align:left;padding:0 16px;height:44px;border-bottom:1px solid var(--border);white-space:nowrap;user-select:none}
th.sortable{cursor:pointer}th.sortable:hover{background:var(--hover)}
th.num,td.num{text-align:right}
.sind{color:#a8a8a8;font-size:10px;margin-left:4px}.sind.on{color:var(--text)}
tbody td{padding:0 16px;height:48px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr.crow{cursor:pointer}tbody tr.crow:hover{background:var(--hover)}
tbody tr.crow.open{background:var(--sel);box-shadow:inset 3px 0 0 var(--blue)}
.chev{display:inline-block;width:14px;color:var(--helper);transition:transform .12s;font-size:10px}
.crow.open .chev{transform:rotate(90deg);color:var(--blue)}
.cname{font-weight:400}a.cname{color:var(--link);text-decoration:none}a.cname:hover{text-decoration:underline}
.socs{display:inline-flex;gap:5px;margin-left:8px;vertical-align:middle}
.soc{display:inline-grid;place-items:center;line-height:0}.soc svg{width:15px;height:15px;display:block}
.tag{display:inline-block;font-size:11px;padding:1px 8px;margin-left:8px;vertical-align:1px;line-height:18px;height:20px}
.tag.p{background:#d0e2ff;color:#0043ce}.tag.n{background:#e0e0e0;color:#525252}
.up{color:var(--success);font-size:11px;margin-left:6px}.dn{color:var(--error);font-size:11px;margin-left:6px}
.recent{max-width:240px}.rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.rd{font-size:11px;color:var(--helper)}
/* detail */
tr.detail>td{background:#f7f7f7;padding:0;border-bottom:1px solid var(--border)}
.dinner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;padding:20px}
.mini{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:10px;letter-spacing:.16px}
.chartbox{height:200px}
.ntable{border:1px solid var(--border);background:#fff}
.ntable th,.ntable td{padding:8px 16px}
.ntable th{height:38px;font-size:11px}.ntable td{height:40px;font-size:12px}
.ntable td:first-child{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ntable th:last-child,.ntable td:last-child{padding-right:18px}
.nlink{color:var(--link);text-decoration:none}.nlink:hover{text-decoration:underline}
.badge{display:inline-block;background:#d0e2ff;color:#0043ce;font-size:10px;padding:0 6px;line-height:16px;margin-right:6px}
/* pagination */
.pager{display:flex;align-items:center;border:1px solid var(--border);border-top:none;background:var(--layer);height:48px;font-size:13px}
.pager .info{padding:0 16px;color:var(--text2);border-right:1px solid var(--border);height:100%;display:flex;align-items:center}
.pager .spacer{flex:1}
.pager .pg{padding:0 16px;color:var(--text2);border-left:1px solid var(--border);height:100%;display:flex;align-items:center}
.pager button{width:48px;height:48px;border:none;border-left:1px solid var(--border);background:var(--layer);cursor:pointer;color:var(--text);font-size:16px}
.pager button:hover:not(:disabled){background:var(--hover)}.pager button:disabled{color:#c6c6c6;cursor:not-allowed}
@media(max-width:820px){.tiles{grid-template-columns:repeat(2,1fr)}.dinner{grid-template-columns:1fr}}
</style><script src="data/data.js"></script><script src="data/socials.js"></script></head><body>
<div class="hdr"><span style="color:#f4f4f4;font-weight:600;font-size:15px;letter-spacing:.3px">OFF-AIR</span><div class="divide"></div><div class="prod">샤오홍슈 트래커</div><div class="spacer"></div><div class="stamp" id="stamp"></div></div>
<div class="tabs"><a class="tab active" href="dashboard.html">현황판</a><a class="tab" href="analysis.html">분석</a><a class="tab" href="report.html">리포트</a></div>
<div class="wrap">
 <div class="sect">대시보드</div>
 <div class="tiles" id="kpis"></div>
 <div class="toolbar"><div class="switcher">
   <button class="sw active" data-f="all">전체</button><button class="sw" data-f="1">계약</button><button class="sw" data-f="0">미계약</button>
 </div><div class="searchwrap"><svg class="sicon" viewBox="0 0 16 16" width="15" height="15"><circle cx="7" cy="7" r="5" fill="none" stroke="#8d8d8d" stroke-width="1.4"/><line x1="10.6" y1="10.6" x2="14" y2="14" stroke="#8d8d8d" stroke-width="1.4"/></svg><input id="search" type="text" placeholder="이름 · uid 검색" autocomplete="off"><button id="searchclr" title="지우기" style="display:none">✕</button></div><div class="count" id="count">인플루언서 카드를 클릭하면 세부 정보를 확인할 수 있습니다</div></div>
 <div id="tbl"></div><div class="pager" id="pager"></div>
</div>
<script>
const D=window.XHS_DATA||{notes:[],profiles:[]};
const notes=D.notes||[],profiles=D.profiles||[],SOCIALS=window.XHS_SOCIALS||{};
const PLAT_ICON={xiaohongshu:`<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="0" fill="#ff2442"/><text x="12" y="17" font-size="13" text-anchor="middle" fill="#fff" font-weight="700" font-family="sans-serif">书</text></svg>`,
instagram:`<svg viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="5" fill="#E1306C"/><rect x="5.6" y="5.6" width="12.8" height="12.8" rx="4" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="12" cy="12" r="3.1" fill="none" stroke="#fff" stroke-width="1.7"/><circle cx="16.5" cy="7.5" r="1.15" fill="#fff"/></svg>`,
youtube:`<svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="3" fill="#FF0000"/><path d="M10 8.7l5.2 3.3L10 15.3z" fill="#fff"/></svg>`,
tiktok:`<svg viewBox="0 0 24 24"><rect width="24" height="24" rx="0" fill="#111"/><path d="M14.2 5.5c.25 1.7 1.35 2.95 3.05 3.15v2.1c-1.05.02-2-.3-3.05-.86v4.35c0 2.35-1.8 4.16-4.05 4.16s-4.05-1.86-4.05-4.16 1.81-4.16 4.05-4.16c.22 0 .43.02.64.06v2.16a2.02 2.02 0 1 0 1.41 1.94V5.5z" fill="#fff"/></svg>`};
const PLAT_NAME={xiaohongshu:'샤오홍슈',instagram:'인스타그램',youtube:'유튜브',tiktok:'틱톡'};
const fmt=n=>{n=n||0;return n>=10000?(n/10000).toFixed(1).replace(/\.0$/,'')+'만':(n).toLocaleString('ko-KR')};
const first=h=>h&&h.length?h[0]:null,last=h=>h&&h.length?h[h.length-1]:null;
function socLink(u,pl){return `<a class="soc" href="${u}" target="_blank" rel="noopener" title="${PLAT_NAME[pl]}" onclick="event.stopPropagation()">${PLAT_ICON[pl]}</a>`}
function socialIcons(p){let s='';if(p.url)s+=socLink(p.url,'xiaohongshu');const ex=SOCIALS[p.uid];if(ex&&ex.url)s+=socLink(ex.url,ex.platform);return s?`<span class="socs">${s}</span>`:''}
document.getElementById('stamp').textContent='업데이트 '+(D.updated_at||'-');
function notesOf(p){const g=notes.filter(n=>n.author&&p.name&&n.author===p.name);g.sort((a,b)=>(a.grid_order??999)-(b.grid_order??999));return g}
function recentOf(g){const wd=g.filter(n=>n.publish_time);if(wd.length)return [...wd].sort((a,b)=>a.publish_time<b.publish_time?1:-1)[0];return g.find(n=>!n.pinned)||g[0]||null}
function fansDelta(p){const f=first(p.history),l=last(p.history);if(!f||!l||f.fans==null)return '';const d=l.fans-f.fans;if(d>0)return `<span class="up">▲ +${fmt(d)}</span>`;if(d<0)return `<span class="dn">▼ ${fmt(-d)}</span>`;return ''}
const sum=(a,k)=>a.reduce((x,y)=>x+(y[k]||0),0);
document.getElementById('kpis').innerHTML=[
 {l:'등록 인플루언서',v:profiles.length},{l:'총 팔로워',v:fmt(sum(profiles,'fans'))},
 {l:'총 좋아요+저장수',v:fmt(sum(profiles,'likes_collects'))},{l:'계약 인플루언서',v:profiles.filter(p=>p.partner).length}
].map(k=>`<div class="tile"><div class="l">${k.l}</div><div class="v">${k.v}</div></div>`).join('');
const VM=profiles.map((p,idx)=>{const g=notesOf(p);const rec=recentOf(g);return {idx,p,g,rec,name:p.name||'',fans:p.fans||0,lc:p.likes_collects||0,ncount:g.length||p.notes_count||0,recent:(rec&&rec.publish_time)||''}});
const drawn={};let sortKey=null,sortDir=-1,curFilter='all',page=0,searchTerm='';const PER=20;
const DEF={name:1,recent:-1,fans:-1,lc:-1,ncount:-1};
function sind(k){if(sortKey!==k)return '<span class="sind">↕</span>';return sortDir>0?'<span class="sind on">▲</span>':'<span class="sind on">▼</span>'}
function curList(){let l=VM.filter(v=>curFilter==='all'?true:(v.p.partner?1:0)===Number(curFilter));
 if(searchTerm){const q=searchTerm.trim().toLowerCase();l=l.filter(v=>(v.name||'').toLowerCase().includes(q)||String(v.p.uid||'').toLowerCase().includes(q));}
 if(sortKey){l=[...l].sort((a,b)=>{let c;if(sortKey==='name'||sortKey==='recent')c=String(a[sortKey]).localeCompare(String(b[sortKey]),'ko');else c=(a[sortKey]||0)-(b[sortKey]||0);return c*sortDir});}return l}
function rowHtml(vm){const {idx,p,g,rec}=vm;const nm=p.name||'(이름 없음)';
 const nameHtml=p.url?`<a class="cname" href="${p.url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${nm}</a>`:`<span class="cname">${nm}</span>`;
 return `<tr class="crow" data-idx="${idx}"><td><span class="chev">▶</span> ${nameHtml}${socialIcons(p)}${p.partner?'<span class="tag p">계약</span>':'<span class="tag n">미계약</span>'}${fansDelta(p)}</td>
 <td class="num mono">${fmt(p.fans)}</td><td class="num mono">${fmt(p.likes_collects)}</td><td class="num mono">${g.length||p.notes_count||0}</td>
 <td class="recent"><div class="rt">${rec?(rec.title||'-'):'-'}</div>${rec&&rec.publish_time?`<div class="rd">${rec.publish_time}</div>`:''}</td></tr>
 <tr class="detail" id="d-${idx}" style="display:none"><td colspan="5"><div class="dinner">
  <div><div class="mini">평일 데이터 그래프 (팔로워·좋아요+저장수 기준)</div><div class="chartbox"><canvas id="c-${idx}"></canvas></div></div>
  <div><div class="mini">최신 게시물</div>${g.length?notesTable(g):'<div style="padding:16px;color:#6f6f6f">수집된 게시물이 없습니다.</div>'}</div>
 </div></td></tr>`}
function notesTable(g){const rec=recentOf(g);const s=[...g].sort((a,b)=>{const da=a.publish_time||'',db=b.publish_time||'';if(da&&db)return da<db?1:(da>db?-1:0);if(da)return -1;if(db)return 1;return (a.grid_order??999)-(b.grid_order??999)});
 let r=`<table class="ntable"><thead><tr><th>제목</th><th>업로드</th><th class="num">좋아요</th><th class="num">저장</th><th class="num">댓글</th></tr></thead><tbody>`;
 s.forEach(n=>{const tag=(n===rec)?'<span class="badge">최근</span>':'';const t=n.title||'-';const tc=n.url?`<a class="nlink" href="${n.url}" target="_blank" rel="noopener">${t}</a>`:t;
  r+=`<tr><td>${tag}${tc}</td><td style="color:#6f6f6f">${n.publish_time||'-'}</td><td class="num mono">${fmt(n.likes)}</td><td class="num mono">${fmt(n.collects)}</td><td class="num mono">${fmt(n.comments)}</td></tr>`});
 return r+'</tbody></table>'}
function render(){const list=curList();const total=list.length;const pages=Math.max(1,Math.ceil(total/PER));if(page>=pages)page=pages-1;const start=page*PER;const slice=list.slice(start,start+PER);
 const thead=`<tr><th class="sortable" data-s="name">인플루언서 ${sind('name')}</th><th class="num sortable" data-s="fans">팔로워 ${sind('fans')}</th><th class="num sortable" data-s="lc">좋아요+저장 ${sind('lc')}</th><th class="num sortable" data-s="ncount">노트 ${sind('ncount')}</th><th class="sortable" data-s="recent">최근 게시물 ${sind('recent')}</th></tr>`;
 const body=slice.length?slice.map(rowHtml).join(''):`<tr><td colspan="5" style="padding:24px 16px;color:#6f6f6f;text-align:center">${searchTerm?`'${searchTerm}' 검색 결과가 없습니다.`:'표시할 인플루언서가 없습니다.'}</td></tr>`;
 document.getElementById('tbl').innerHTML=`<table><thead>${thead}</thead><tbody>${body}</tbody></table>`;
 const cd=document.getElementById('count');if(cd)cd.textContent=searchTerm?`검색 결과 ${total}명`:'인플루언서 카드를 클릭하면 세부 정보를 확인할 수 있습니다';
 const from=total?start+1:0,to=Math.min(start+PER,total);
 document.getElementById('pager').innerHTML=`<div class="info">${from}–${to} / ${total}명</div><div class="spacer"></div><div class="pg">페이지 ${page+1} / ${pages}</div>
  <button id="first" ${page===0?'disabled':''} title="첫 페이지">«</button><button id="prev" ${page===0?'disabled':''} title="이전">‹</button><button id="next" ${page>=pages-1?'disabled':''} title="다음">›</button><button id="last" ${page>=pages-1?'disabled':''} title="끝 페이지">»</button>`;
 bind();}
function bind(){
 document.querySelectorAll('#tbl .crow').forEach(row=>row.addEventListener('click',()=>{const i=row.dataset.idx;const d=document.getElementById('d-'+i);const open=d.style.display!=='none';d.style.display=open?'none':'';row.classList.toggle('open',!open);if(!open&&!drawn[i]){drawn[i]=true;drawChart(i)}}));
 document.querySelectorAll('#tbl th.sortable').forEach(th=>th.addEventListener('click',()=>{const k=th.dataset.s;if(sortKey===k)sortDir=-sortDir;else{sortKey=k;sortDir=DEF[k]||-1}page=0;render()}));
 const fs=document.getElementById('first'),pv=document.getElementById('prev'),nx=document.getElementById('next'),ls=document.getElementById('last');
 if(fs)fs.onclick=()=>{if(page>0){page=0;render()}};
 if(pv)pv.onclick=()=>{if(page>0){page--;render()}};
 if(nx)nx.onclick=()=>{page++;render()};
 if(ls)ls.onclick=()=>{page=1e9;render()};}
function drawChart(idx){const p=profiles[idx];const h=p.history||[];const ctx=document.getElementById('c-'+idx);if(!ctx||h.length<1)return;
 Chart.defaults.font.family="'IBM Plex Sans','Malgun Gothic',sans-serif";
 new Chart(ctx,{type:'line',data:{labels:h.map(x=>x.date),datasets:[
  {label:'팔로워',data:h.map(x=>x.fans),borderColor:'#0f62fe',backgroundColor:'rgba(15,98,254,.06)',fill:true,tension:0,borderWidth:1.75,pointRadius:2},
  {label:'좋아요+저장',data:h.map(x=>x.likes_collects),borderColor:'#007d79',backgroundColor:'rgba(0,125,121,.05)',fill:true,tension:0,borderWidth:1.75,pointRadius:2}]},
  options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{labels:{boxWidth:10,font:{size:11}}},tooltip:{backgroundColor:'#161616',cornerRadius:0,padding:10,callbacks:{label:c=>c.dataset.label+': '+fmt(c.parsed.y)}}},
   scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'#e0e0e0'},ticks:{font:{size:10},callback:v=>fmt(v)}}}}})}
document.querySelectorAll('.sw').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.sw').forEach(x=>x.classList.remove('active'));b.classList.add('active');curFilter=b.dataset.f;page=0;render()}));
(function(){const si=document.getElementById('search'),cl=document.getElementById('searchclr');
 if(si)si.addEventListener('input',()=>{searchTerm=si.value;cl.style.display=si.value?'':'none';page=0;render()});
 if(cl)cl.addEventListener('click',()=>{si.value='';searchTerm='';cl.style.display='none';page=0;render();si.focus()});})();
render();
</script></body></html>
